# Railway config — Dockerfile build + explicit start (does not rely on bash).
# Local Docker / Compose use image CMD: scripts/start.sh
# Attach a persistent volume with mount path /data:
#   railway volume add --mount-path /data

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Must run under a shell so ${PORT} expands (Railway passes startCommand as-is otherwise)
startCommand = "/bin/sh -c 'python3 -m uvicorn backend.main:app --host 0.0.0.0 --port ${PORT:-8000}'"
#healthcheckPath = "/health"
#healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
