# Railway config — Dockerfile deploy for the F-Droid dual-mode server.
# Attach a persistent volume with mount path /data (dashboard or:
#   railway volume add --mount-path /data)

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "python3 -m uvicorn backend.main:app --host 0.0.0.0 --port ${PORT:-8000}"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
